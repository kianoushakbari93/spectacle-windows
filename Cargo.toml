[package]
name = "spectacle"
version = "3.0.0"
description = "Easily organize windows without using a mouse."
authors = ["Eric Czarny", "Kianoush Akbari"]
license = "MIT"
edition = "2024"
rust-version = "1.99"
publish = false
build = "build.rs"

[[bin]]
name = "Spectacle"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Recovery",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
